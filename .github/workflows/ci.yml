name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -c requirements-build.txt 'tigris-ml[dev]>=0.9.0'
      - name: Lint
        run: .venv/bin/ruff check --select E4,E7,E9,F recipes scripts tests
      - name: Test
        run: .venv/bin/python -m pytest tests -q
